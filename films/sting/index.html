<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Intro sting — Jeevanandh</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/film.css">
    <style>
      #tag { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 260px; }
      #role { color: var(--ink-2); font-size: 26px; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dtht" id="root" class="film" data-world="digital" data-composition-id="sting" data-start="0" data-width="1920" data-height="1080" data-duration="4">
      <canvas data-hf-id="hf-4dkf" id="field" class="field" width="1920" height="1080"></canvas>
      <div data-hf-id="hf-4swb" id="tag" class="layer">
        <p data-hf-id="hf-gv7i" id="role" class="label">AI &amp; Data Science Engineer</p>
      </div>
      <div data-hf-id="hf-431g" class="lens"></div>
      <audio data-hf-id="hf-i7vm" id="a-boot" src="assets/sfx/boot.wav" data-start="0" data-duration="1.6" data-volume="0.8"></audio>
      <audio data-hf-id="hf-kimt" id="a-whoosh" src="assets/sfx/whoosh.wav" data-start="0.8" data-duration="1.4" data-volume="0.7"></audio>
      <audio data-hf-id="hf-o2gn" id="a-tick" src="assets/sfx/tick.wav" data-start="2.15" data-duration="0.12" data-volume="0.7"></audio>
      <audio data-hf-id="hf-9jxs" id="a-hit" src="assets/sfx/hit.wav" data-start="1.05" data-duration="1.2" data-volume="0.8"></audio>
    </div>
    <script type="module">
      import { createField, track, morphs, scramble } from "./assets/engine.js";

      const DUR = 4;
      async function build() {
        await document.fonts.ready;
        const field = await createField(document.getElementById("field"));
        const shape = morphs([[0.9, 2.6, "boot", "signal"]], "boot");
        const glitch = track([[0, 0.5], [0.3, 0, "out"], [0.85, 0], [1.0, 0.7, "in"], [1.4, 0, "out"], [3.45, 0], [3.8, 1, "in"], [4, 0.3]]);
        const scatter = track([[0, 0], [3.5, 0], [4, 0.45, "in"]]);
        const st = { world: 0, focus: 0, focusAmt: 0, dim: 1, pulse: 0, camX: 0, camY: 0, offX: null, offY: null };
        const draw = (t) => {
          Object.assign(st, shape(t), { glitch: glitch(t), scatter: scatter(t) });
          field.render(t, st);
        };

        const tl = gsap.timeline({ paused: true });
        gsap.set("#tag", { autoAlpha: 0 });
        tl.set("#tag", { autoAlpha: 1 }, 2.1);
        scramble(tl, document.getElementById("role"), 2.15, 0.8, { seed: 2 });
        tl.to("#tag", { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 3.6);
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        draw(0);
        window.__timelines["sting"] = tl;
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["sting-field"] = build();
    </script>
  </body>
</html>
