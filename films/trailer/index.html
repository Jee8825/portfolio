<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;enum&quot;,&quot;label&quot;:&quot;Project&quot;,&quot;default&quot;:&quot;recall&quot;,&quot;options&quot;:[
      {&quot;value&quot;:&quot;recall&quot;,&quot;label&quot;:&quot;Recall&quot;},
      {&quot;value&quot;:&quot;findesk&quot;,&quot;label&quot;:&quot;FinDesk&quot;},
      {&quot;value&quot;:&quot;synapse&quot;,&quot;label&quot;:&quot;SYNAPSE&quot;},
      {&quot;value&quot;:&quot;cognitia-ai&quot;,&quot;label&quot;:&quot;Cognitia AI&quot;}
    ]}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Project trailer — Jeevanandh</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/film.css">
    <style>
      #hook { display: flex; flex-direction: column; justify-content: center; gap: 28px; }
      #hook p { font-size: 104px; max-width: 1400px; }
      #title { display: flex; flex-direction: column; justify-content: center; }
      #name { font-size: 230px; margin: 26px 0 22px; }
      #tagline { color: var(--ink-2); }
      #arch { display: flex; flex-direction: column; justify-content: center; gap: 30px; }
      #arch-svg { width: 1460px; }
      #arch-svg svg { width: 100%; height: auto; overflow: visible; }
      #metrics { display: flex; flex-direction: column; justify-content: center; gap: 40px; }
      .metric { display: grid; grid-template-columns: 560px 1fr; align-items: baseline; gap: 40px; border-top: 1px solid rgb(232 236 239 / 0.14); padding-top: 26px; width: 1180px; }
      .metric .v { font-size: 104px; }
      .metric .l { color: var(--ink); }
      .metric .n { color: var(--ink-3); margin-top: 8px; font-size: 18px; text-transform: none; letter-spacing: 0.04em; }
      #thesis { display: flex; align-items: center; }
      #thesis p { font-size: 116px; max-width: 1180px; }
      #end { display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding-bottom: 130px; }
      #end-name { font-size: 140px; }
      #end-meta { display: flex; gap: 48px; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-6msb" id="root" class="film" data-world="digital" data-composition-id="trailer" data-start="0" data-width="1920" data-height="1080" data-duration="20">
      <canvas data-hf-id="hf-4dkf" id="field" class="field" width="1920" height="1080"></canvas>

      <div data-hf-id="hf-xk3g" id="hook" class="layer">
        <p data-hf-id="hf-11ey" id="hook1" class="display signal">Hook one.</p>
        <p data-hf-id="hf-9h5a" id="hook2" class="display signal t1">Hook two.</p>
      </div>

      <div data-hf-id="hf-c0y9" id="title" class="layer">
        <p data-hf-id="hf-v2lj" class="label"><span data-hf-id="hf-gj8q" id="code" class="t3">W/01</span>&#160;&#160;&#160;<span data-hf-id="hf-0wou" id="status">STATUS</span></p>
        <h1 data-hf-id="hf-vhfo" id="name" class="display signal">Project</h1>
        <p data-hf-id="hf-hwjh" id="tagline" class="label">Tagline</p>
      </div>

      <div data-hf-id="hf-3d85" id="arch" class="layer">
        <p data-hf-id="hf-jyt9" id="arch-label" class="label">How it works</p>
        <div data-hf-id="hf-ieco" id="arch-svg"></div>
      </div>

      <div data-hf-id="hf-jqpw" id="metrics" class="layer">
        <div data-hf-id="hf-dq4c" class="metric"><p data-hf-id="hf-6fk5" class="display v t1" id="m0v">0</p><div data-hf-id="hf-yeow"><p data-hf-id="hf-len6" class="label l" id="m0l">metric</p><p data-hf-id="hf-dhxu" class="label n" id="m0n"></p></div></div>
        <div data-hf-id="hf-q6lw" class="metric"><p data-hf-id="hf-e6if" class="display v t2" id="m1v">0</p><div data-hf-id="hf-y7yw"><p data-hf-id="hf-40n1" class="label l" id="m1l">metric</p><p data-hf-id="hf-ejf5" class="label n" id="m1n"></p></div></div>
        <div data-hf-id="hf-ozot" class="metric"><p data-hf-id="hf-tapx" class="display v t3" id="m2v">0</p><div data-hf-id="hf-x11t"><p data-hf-id="hf-2oi4" class="label l" id="m2l">metric</p><p data-hf-id="hf-i3bw" class="label n" id="m2n"></p></div></div>
      </div>

      <div data-hf-id="hf-a5s9" id="thesis" class="layer">
        <p data-hf-id="hf-h41s" id="thesis-line" class="display signal">Thesis.</p>
      </div>

      <div data-hf-id="hf-fmy8" id="end" class="layer">
        <p data-hf-id="hf-y4gq" class="label t3" id="end-code">W/01</p>
        <p data-hf-id="hf-lsnn" id="end-name" class="display signal">Project</p>
        <div data-hf-id="hf-d587" id="end-meta" class="label">
          <span data-hf-id="hf-lb7g" id="end-repo">github.com/Jee8825</span>
          <span data-hf-id="hf-xtgq">Jeevanandh — AI &amp; Data Science Engineer</span>
        </div>
      </div>

      <div data-hf-id="hf-431g" class="lens"></div>

      <audio data-hf-id="hf-zopf" id="a-drone" src="assets/sfx/drone.wav" data-start="0" data-duration="20" data-volume="0.55"></audio>
      <audio data-hf-id="hf-52k9" id="a-boot" src="assets/sfx/boot.wav" data-start="0" data-duration="1.6" data-volume="0.7"></audio>
      <audio data-hf-id="hf-jpcg" id="a-whoosh-1" src="assets/sfx/whoosh.wav" data-start="4.15" data-duration="1.4" data-volume="0.8"></audio>
      <audio data-hf-id="hf-k53n" id="a-hit-1" src="assets/sfx/hit.wav" data-start="4.85" data-duration="1.2" data-volume="0.95"></audio>
      <audio data-hf-id="hf-ga5p" id="a-tick-1" src="assets/sfx/tick.wav" data-start="7.85" data-duration="0.12" data-volume="0.7"></audio>
      <audio data-hf-id="hf-f37k" id="a-tick-2" src="assets/sfx/tick.wav" data-start="12.3" data-duration="0.12" data-volume="0.7"></audio>
      <audio data-hf-id="hf-sn2o" id="a-tick-3" src="assets/sfx/tick.wav" data-start="13.3" data-duration="0.12" data-volume="0.7"></audio>
      <audio data-hf-id="hf-5nn4" id="a-tick-4" src="assets/sfx/tick.wav" data-start="14.3" data-duration="0.12" data-volume="0.7"></audio>
      <audio data-hf-id="hf-ppgj" id="a-riser" src="assets/sfx/riser.wav" data-start="13.5" data-duration="2.2" data-volume="0.45"></audio>
      <audio data-hf-id="hf-2nvd" id="a-hit-2" src="assets/sfx/hit.wav" data-start="15.7" data-duration="1.2" data-volume="0.85"></audio>
      <audio data-hf-id="hf-v6hf" id="a-whoosh-2" src="assets/sfx/whoosh.wav" data-start="18.25" data-duration="1.4" data-volume="0.6"></audio>
    </div>

    <script type="module">
      import { site, createField, track, morphs, scramble, words, chars, diagram, packetsAt } from "./assets/engine.js";

      const DUR = 20;
      const featured = site.projects.filter((p) => p.featured && p.chapter);

      async function build() {
        const vars = window.__hyperframes?.getVariables?.() ?? {};
        const index = Math.max(0, featured.findIndex((p) => p.slug === vars.slug));
        const p = featured[index];
        const ch = p.chapter;
        const code = `W/${String(index + 1).padStart(2, "0")}`;
        const $ = (id) => document.getElementById(id);

        /* ---------- content ---------- */
        $("hook1").textContent = ch.hook[0];
        $("hook2").textContent = ch.hook[1];
        $("code").textContent = code;
        $("status").textContent = `${p.status.toUpperCase()} · ${site.tiers[p.tier].name.toUpperCase()} TIER`;
        $("name").textContent = p.name;
        $("tagline").textContent = p.tagline;
        ch.metrics.forEach((m, i) => {
          $(`m${i}v`).textContent = m.value;
          $(`m${i}l`).textContent = m.label;
          $(`m${i}n`).textContent = m.note ?? "";
        });
        $("thesis-line").textContent = ch.thesis;
        $("end-code").textContent = code;
        $("end-name").textContent = p.name;
        const repo = p.links?.find((l) => l.href.includes("github.com"));
        $("end-repo").textContent = repo ? repo.href.replace("https://", "") : "github.com/Jee8825";
        const dg = diagram(ch.architecture);
        $("arch-svg").appendChild(dg.svg);

        await document.fonts.ready;
        // fit the project name to the left column so it never runs into the object
        const g = document.createElement("canvas").getContext("2d");
        g.font = '560 230px "Fraunces Variable"';
        const nameW = g.measureText(p.name).width * 0.965; // letter-spacing -0.035em
        $("name").style.fontSize = `${Math.min(230, Math.floor((230 * 820) / nameW))}px`;
        const field = await createField($("field"));

        /* ---------- field: a pure function of time ---------- */
        const shape = morphs([[4.45, 6.2, "boot", ch.formation]], "boot");
        const glitch = track([[0, 0.25], [0.35, 0, "out"], [4.2, 0], [4.42, 1, "in"], [4.95, 0, "out"], [19.4, 0], [19.75, 0.8, "in"], [20, 0.2]]);
        const scatter = track([[0, 0], [4.25, 0], [4.48, 0.55, "in"], [6.2, 0, "expo"], [19.45, 0], [20, 0.35, "in"]]);
        const dim = track([[0, 1], [7.7, 1], [8.2, 0.32], [11.8, 0.32], [12.4, 0.75], [15.5, 0.75], [15.9, 1]]);
        const pulse = track([[0, 0], [15.65, 0], [17.3, 1, "out"], [17.31, 0]]);
        const camX = track([[0, 0], [6.2, 0.6], [12, -0.4], [20, 0.3]]);
        // the scanline sits in the lower third under the hook; the object slides aside for the diagram
        const offY = track([[0, -2.4], [4.3, -2.4], [5.6, 0, "out"]]);
        const baseX = site.STAGING[ch.formation].offset[0];
        const offX = track([[0, 0], [4.3, 0], [5.6, baseX, "out"], [7.7, baseX], [8.4, baseX + 2.3], [11.8, baseX + 2.3], [12.5, baseX]]);
        const st = { world: 0, focus: 0, focusAmt: 0, camY: 0, offX: 0, offY: 0 };

        const draw = (t) => {
          Object.assign(st, shape(t), { glitch: glitch(t), scatter: scatter(t), dim: dim(t), pulse: pulse(t), camX: camX(t), offX: offX(t), offY: offY(t) });
          field.render(t, st);
          packetsAt(dg.edges, t);
        };

        /* ---------- DOM choreography ---------- */
        const tl = gsap.timeline({ paused: true });
        const layers = ["#hook", "#title", "#arch", "#metrics", "#thesis", "#end"];
        gsap.set(layers, { autoAlpha: 0 });

        // 0 – 4.3 · cold open
        const h1 = words($("hook1"));
        const h2 = words($("hook2"));
        tl.set("#hook", { autoAlpha: 1 }, 0.2)
          .fromTo(h1, { yPercent: 110 }, { yPercent: 0, duration: 0.9, stagger: 0.06, ease: "expo.out" }, 0.3)
          .fromTo(h2, { yPercent: 110 }, { yPercent: 0, duration: 0.9, stagger: 0.06, ease: "expo.out" }, 2.1)
          .to("#hook", { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 4.2);

        // 4.6 – 7.6 · title card
        const nameChars = chars($("name"));
        tl.set("#title", { autoAlpha: 1 }, 4.6);
        scramble(tl, $("code"), 4.62, 0.5, { seed: 3 });
        scramble(tl, $("status"), 4.7, 0.7, { seed: 5 });
        tl.fromTo(nameChars, { yPercent: 115, rotate: 7 }, { yPercent: 0, rotate: 0, duration: 1.1, stagger: 0.04, ease: "expo.out" }, 4.85);
        scramble(tl, $("tagline"), 5.5, 0.9, { seed: 7 });
        tl.to("#title", { y: -40, autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 7.35);

        // 7.8 – 11.9 · how it works
        tl.set("#arch", { autoAlpha: 1 }, 7.75);
        scramble(tl, $("arch-label"), 7.8, 0.5, { seed: 11 });
        tl.fromTo(dg.nodes, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.11, ease: "back.out(2)" }, 7.95);
        dg.edges.forEach((e, i) => {
          const len = e.path.getTotalLength();
          tl.fromTo(e.path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 8.25 + i * 0.12);
          tl.fromTo(e.dot, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 8.6 + i * 0.12);
          if (e.lab) tl.fromTo(e.lab, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 8.7 + i * 0.12);
        });
        tl.to("#arch", { y: -30, autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 11.75);

        // 12.2 – 15.5 · proof
        tl.set("#metrics", { autoAlpha: 1 }, 12.15);
        [0, 1, 2].forEach((i) => {
          const at = 12.25 + i;
          tl.fromTo(`#metrics .metric:nth-child(${i + 1})`, { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "expo.out" }, at);
          scramble(tl, $(`m${i}v`), at, 0.75, { chars: "0123456789.→×", seed: 20 + i });
        });
        tl.to("#metrics", { autoAlpha: 0, y: -30, duration: 0.4, ease: "power2.in" }, 15.35);

        // 15.8 – 18.3 · thesis
        const th = words($("thesis-line"));
        tl.set("#thesis", { autoAlpha: 1 }, 15.75)
          .fromTo(th, { yPercent: 110 }, { yPercent: 0, duration: 1, stagger: 0.07, ease: "expo.out" }, 15.8)
          .to("#thesis", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 18.2);

        // 18.6 – 20 · end card
        tl.set("#end", { autoAlpha: 1 }, 18.55)
          .fromTo("#end-name", { yPercent: 40, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: 0.8, ease: "expo.out" }, 18.6)
          .fromTo("#end-meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 18.9);
        scramble(tl, $("end-code"), 18.6, 0.5, { seed: 31 });

        // the field redraws on every seek, after everything above has settled
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        draw(0);
        window.__timelines["trailer"] = tl;
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["trailer-field"] = build();
    </script>
  </body>
</html>
